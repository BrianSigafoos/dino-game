<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Dino Flip Facts</title>
    <meta
      name="description"
      content="Flip through kid friendly dinosaur facts in a fast flash card game."
    />
    <!-- iOS Safari improvements -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Theme color for browser chrome -->
    <meta name="theme-color" content="#0d1f15" />
    <!-- App icons -->
    <link rel="icon" type="image/png" href="images/quetzalcoatlus.png" />
    <link rel="apple-touch-icon" href="images/quetzalcoatlus.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700&family=Bungee&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=13" />
    <script src="data.js?v=13"></script>
    <script defer src="app.js?v=13"></script>
  </head>
  <body>
    <div class="bg-grid"></div>
    <div class="bg-blob blob-one"></div>
    <div class="bg-blob blob-two"></div>

    <div class="page">
      <header class="hero">
        <div class="hero-top">
          <div class="logo">
            <span class="logo-mark">D</span>
            <span class="logo-text">Dino Flip Facts</span>
          </div>
          <button
            class="theme-toggle"
            id="theme-toggle"
            type="button"
            aria-pressed="false"
          >
            <span class="theme-label">Dark mode</span>
            <span class="theme-track">
              <span class="theme-thumb"></span>
            </span>
          </button>
        </div>
        <h1>Flip a card. Learn a dino fact.</h1>
        <div class="level-select" id="level-select">
          <div class="level-buttons">
            <button
              class="btn primary level-btn"
              id="beginner-btn"
              type="button"
            >
              Beginner
            </button>
            <button
              class="btn primary level-btn"
              id="advanced-btn"
              type="button"
            >
              Advanced
            </button>
          </div>
        </div>
      </header>

      <main class="game">
        <button
          class="exit-btn"
          id="exit-btn"
          type="button"
          aria-label="Exit fullscreen"
        >
          ✕
        </button>
        <div class="swipe-hint" id="swipe-hint">
          <span class="swipe-arrow left">←</span>
          <span class="swipe-text">Swipe or tap</span>
          <span class="swipe-arrow right">→</span>
        </div>
        <section class="card-area" aria-live="polite">
          <button class="card" id="card" type="button" aria-pressed="false">
            <div class="card-face card-front">
              <div class="card-badge">Clue</div>
              <p id="card-clue"></p>
              <div class="card-actions">
                <div
                  class="icon-btn"
                  id="read-aloud-btn"
                  role="button"
                  tabindex="0"
                  aria-label="Read clue aloud"
                >
                  🔊
                </div>
                <div
                  class="icon-btn"
                  id="card-hint-toggle"
                  role="button"
                  tabindex="0"
                  aria-label="Show hint image"
                  aria-expanded="false"
                  hidden
                >
                  🔍
                </div>
              </div>
              <div class="card-hint-section" id="card-hint-section" hidden>
                <img
                  class="card-image hint"
                  id="card-hint-image"
                  src=""
                  alt=""
                  loading="lazy"
                />
              </div>
              <div class="card-hint">Tap to reveal the answer</div>
            </div>
            <div class="card-face card-back">
              <div class="card-badge alt">Answer</div>
              <h2 id="card-answer"></h2>
              <div class="card-image-wrap" id="card-answer-image-wrap" hidden>
                <img
                  class="card-image answer"
                  id="card-answer-image"
                  src=""
                  alt=""
                  loading="lazy"
                />
              </div>
              <p id="card-fact"></p>
              <div class="card-meta">
                <span id="card-era"></span>
                <span id="card-size"></span>
              </div>
            </div>
          </button>
        </section>

        <section class="controls">
          <div class="progress">
            <div class="progress-text">
              Card <span id="card-index">1</span> of
              <span id="card-total">1</span>
            </div>
            <div class="progress-bar">
              <div class="progress-fill" id="progress-fill"></div>
            </div>
          </div>
          <div class="button-row">
            <button class="btn secondary" id="shuffle-btn" type="button">
              Shuffle
            </button>
            <button class="btn secondary" id="flip-btn" type="button">
              Flip
            </button>
            <button class="btn primary" id="next-btn" type="button">
              Next card
            </button>
          </div>
          <div class="helper" id="helper-text">
            Tip: Tap the card to flip back and forth.
          </div>
        </section>
      </main>

      <footer class="footer">
        <div class="footer-links">
          <a href="https://briansigafoos.com" target="_blank" rel="noreferrer">
            Brian Sigafoos 🦖
          </a>
          <span>🌴</span>
          <a
            href="https://github.com/BrianSigafoos/dino-game"
            target="_blank"
            rel="noreferrer"
          >
            GitHub
          </a>
          <span>🌴</span>
          <a href="https://tools.bfoos.net" target="_blank" rel="noreferrer">
            More tools
          </a>
        </div>
        <span class="footer-note">Built for tiny paleontologists.</span>
      </footer>
    </div>
  </body>
</html>
